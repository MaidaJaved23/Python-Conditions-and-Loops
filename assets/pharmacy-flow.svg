x1="0" y1="240" x2="1600" y2="240" stroke="#1e2d5a" stroke-opacity=".35"/><line x1="0" y1="320" x2="1600" y2="320" stroke="#1e2d5a" stroke-opacity=".35"/><line x1="0" y1="400" x2="1600" y2="400" stroke="#1e2d5a" stroke-opacity=".35"/><line x1="0" y1="480" x2="1600" y2="480" stroke="#1e2d5a" stroke-opacity=".35"/><line x1="0" y1="560" x2="1600" y2="560" stroke="#1e2d5a" stroke-opacity=".35"/><line x1="0" y1="640" x2="1600" y2="640" stroke="#1e2d5a" stroke-opacity=".35"/><line x1="0" y1="720" x2="1600" y2="720" stroke="#1e2d5a" stroke-opacity=".35"/><line x1="0" y1="800" x2="1600" y2="800" stroke="#1e2d5a" stroke-opacity=".35"/><line x1="0" y1="880" x2="1600" y2="880" stroke="#1e2d5a" stroke-opacity=".35"/><line x1="0" y1="960" x2="1600" y2="960" stroke="#1e2d5a" stroke-opacity=".35"/><line x1="0" y1="1040" x2="1600" y2="1040" stroke="#1e2d5a" stroke-opacity=".35"/><line x1="0" y1="1120" x2="1600" y2="1120" stroke="#1e2d5a" stroke-opacity=".35"/><text x="60" y="64" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="800" fill="#fff" text-anchor="start" >Pharmacy processing loop</text><text x="60" y="98" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="400" fill="#9fb3d9" text-anchor="start" >One pass per medicine, updating revenue and restock counters each time</text><g class="fd" style="animation-delay:0.00s"><rect x="40" y="125" width="480" height="125" rx="20" fill="#f6ecd9" filter="url(#sh)"/><circle cx="94" cy="187.5" r="26" fill="#c8553d"/><text x="94" y="196.5" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" fill="#fff" text-anchor="middle" >1</text><text x="140" y="180.5" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700" fill="#1b1410" text-anchor="start" >Show the title</text><text x="140" y="208.5" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#6b5a4a" text-anchor="start" >Pharmacy program banner</text></g><g class="fd" style="animation-delay:0.10s"><rect x="560" y="125" width="480" height="125" rx="20" fill="#f6ecd9" filter="url(#sh)"/><circle cx="614" cy="187.5" r="26" fill="#c8553d"/><text x="614" y="196.5" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" fill="#fff" text-anchor="middle" >2</text><text x="660" y="180.5" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700" fill="#1b1410" text-anchor="start" >Medicine count</text><text x="660" y="208.5" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#6b5a4a" text-anchor="start" >Whole number above 0</text></g><g class="fd" style="animation-delay:0.20s"><rect x="1080" y="125" width="480" height="125" rx="20" fill="#f6ecd9" filter="url(#sh)"/><circle cx="1134" cy="187.5" r="26" fill="#c8553d"/><text x="1134" y="196.5" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" fill="#fff" text-anchor="middle" >3</text><text x="1180" y="180.5" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700" fill="#1b1410" text-anchor="start" >Initialize counters</text><text x="1180" y="208.5" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#6b5a4a" text-anchor="start" >processed, restock, revenue = 0</text></g><path d="M280 250V272H1320V250" class="flow" fill="none" stroke="#f08a5d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M800 272V300" class="flow" fill="none" stroke="#f08a5d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="25" y="300" width="1550" height="715" rx="26" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="10 8"/><text x="300" y="330" font-family="'SFMono-Regular',Consolas,Menlo,'Liberation Mono',monospace" font-size="21" font-weight="600" fill="#c4b5fd" text-anchor="start" >for medicine_number in range(1, medicine_count + 1):</text><g class="fd" style="animation-delay:0.30s"><rect x="60" y="370" width="340" height="120" rx="20" fill="#f6ecd9" filter="url(#sh)"/><circle cx="114" cy="430.0" r="26" fill="#c8553d"/><text x="114" y="439.0" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" fill="#fff" text-anchor="middle" >4</text><text x="160" y="423.0" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700" fill="#1b1410" text-anchor="start" >Enter name</text><text x="160" y="451.0" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#6b5a4a" text-anchor="start" >Not blank</text></g><g class="fd" style="animation-delay:0.40s"><rect x="440" y="370" width="340" height="120" rx="20" fill="#f6ecd9" filter="url(#sh)"/><circle cx="494" cy="430.0" r="26" fill="#c8553d"/><text x="494" y="439.0" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" fill="#fff" text-anchor="middle" >5</text><text x="540" y="423.0" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700" fill="#1b1410" text-anchor="start" >Enter stock</text><text x="540" y="451.0" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#6b5a4a" text-anchor="start" >Integer, 0 or more</text></g><g class="fd" style="animation-delay:0.50s"><rect x="820" y="370" width="340" height="120" rx="20" fill="#f6ecd9" filter="url(#sh)"/><circle cx="874" cy="430.0" r="26" fill="#c8553d"/><text x="874" y="439.0" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" fill="#fff" text-anchor="middle" >6</text><text x="920" y="423.0" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700" fill="#1b1410" text-anchor="start" >Enter price</text><text x="920" y="451.0" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#6b5a4a" text-anchor="start" >Number above 0</text></g><g class="fd" style="animation-delay:0.60s"><rect x="1200" y="370" width="340" height="120" rx="20" fill="#f6ecd9" filter="url(#sh)"/><circle cx="1254" cy="430.0" r="26" fill="#c8553d"/><text x="1254" y="439.0" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" fill="#fff" text-anchor="middle" >7</text><text x="1300" y="423.0" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700" fill="#1b1410" text-anchor="start" >Enter quantity</text><text x="1300" y="451.0" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#6b5a4a" text-anchor="start" >Integer, 0 or more</text></g><path d="M400 430H440" class="flow" fill="none" stroke="#f08a5d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M780 430H820" class="flow" fill="none" stroke="#f08a5d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M1160 430H1200" class="flow" fill="none" stroke="#f08a5d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M1360 490V515H800V540" class="flow" fill="none" stroke="#f08a5d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><g class="fd" style="animation-delay:0.80s"><rect x="500" y="540" width="600" height="110" rx="20" fill="#141a30" stroke="#c8553d" stroke-width="2.5" filter="url(#sh)"/><circle cx="554" cy="595.0" r="26" fill="#c8553d"/><text x="554" y="604.0" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" fill="#fff" text-anchor="middle" >8</text><text x="600" y="588.0" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700" fill="#f6ecd9" text-anchor="start" >Quantity above stock?</text><text x="600" y="616.0" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#c9b9a3" text-anchor="start" >insufficient stock check</text></g><path d="M800 650V682" class="flow" fill="none" stroke="#f08a5d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M410 682H1190" class="flow" fill="none" stroke="#f08a5d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M410 682V715" class="flow" fill="none" stroke="#f08a5d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M1190 682V715" class="flow" fill="none" stroke="#f08a5d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="498.61" y="653" width="212.78" height="27" rx="8" fill="#0b1020" /><text x="605" y="672" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="500" fill="#f6ecd9" text-anchor="middle" >yes: not enough stock</text><rect x="911.56" y="653" width="166.88" height="27" rx="8" fill="#0b1020" /><text x="995" y="672" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="500" fill="#f6ecd9" text-anchor="middle" >no: enough stock</text><g class="fd" style="animation-delay:1.00s"><rect x="60" y="715" width="700" height="130" rx="20" fill="#141a30" stroke="#c8553d" stroke-width="2.5" filter="url(#sh)"/><text x="90" y="760.0" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700" fill="#f6ecd9" text-anchor="start" >SALE REJECTED</text><text x="90" y="788.0" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#c9b9a3" text-anchor="start" >Revenue for it stays 0</text><text x="90" y="814.0" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#c9b9a3" text-anchor="start" >Available stock unchanged</text></g><g class="fd" style="animation-delay:1.10s"><rect x="840" y="715" width="700" height="130" rx="20" fill="#f6ecd9" filter="url(#sh)"/><text x="870" y="760.0" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700" fill="#1b1410" text-anchor="start" >SALE COMPLETED</text><text x="870" y="788.0" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#6b5a4a" text-anchor="start" >amount = quantity * price; stock -= quantity</text><text x="870" y="814.0" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#6b5a4a" text-anchor="start" >total_revenue += amount</text></g><path d="M410 845V862H800" class="flow" fill="none" stroke="#f08a5d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M1190 845V862H800" class="flow" fill="none" stroke="#f08a5d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M800 862V885" class="flow" fill="none" stroke="#f08a5d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><g class="fd" style="animation-delay:1.20s"><rect x="450" y="885" width="700" height="105" rx="20" fill="#141a30" stroke="#c8553d" stroke-width="2.5" filter="url(#sh)"/><circle cx="504" cy="937.5" r="26" fill="#c8553d"/><text x="504" y="946.5" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" fill="#fff" text-anchor="middle" >9</text><text x="550" y="930.5" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700" fill="#f6ecd9" text-anchor="start" >Remaining stock below 10?</text><text x="550" y="958.5" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="400" fill="#c9b9a3" text-anchor="start" >yes: warning and restock_count += 1</text></g><path d="M450 937H40V345H230V370" class="flow" fill="none" stroke="#f08a5d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="60" y="925" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#f08a5d" text-anchor="start" >repeat for next medicine</text><path d="M800 990V1050" class="flow" fill="none" stroke="#f08a5d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="815" y="1035" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#f08a5d" text-anchor="start" >after the last medicine</text><rect x="60" y="1050" width="1480" height="60" rx="18" fill="#141a30" stroke="#c8553d" stroke-width="2.5"/><text x="800" y="1088" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="600" fill="#f6ecd9" text-anchor="middle" >Print the daily report: processed count, total revenue, restock count</text></svg>