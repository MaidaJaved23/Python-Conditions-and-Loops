<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" role="img" aria-label="Pharmacy Inventory – Processing Loop"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1b1f4b"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker></defs><style>.t{font:600 19px 'Segoe UI',Arial,sans-serif;fill:#e2e8f0}.s{font:400 14px 'Segoe UI',Arial,sans-serif;fill:#94a3b8}.h{font:700 26px 'Segoe UI',Arial,sans-serif;fill:#fff}.l{font:700 15px 'Segoe UI',Arial,sans-serif}.e{fill:none;stroke:#7dd3fc;stroke-width:3;stroke-dasharray:10 8;animation:f 1.1s linear infinite}@keyframes f{to{stroke-dashoffset:-18}}.n{opacity:0;animation:i .7s ease forwards}@keyframes i{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.m{font:500 15px ui-monospace,Consolas,monospace;fill:#cbd5e1}</style><rect width="1600" height="600" rx="24" fill="url(#bg)"/><text x="40" y="52" class="h">Pharmacy Inventory – Processing Loop</text><rect x="390" y="60" width="950" height="520" rx="22" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="8 8"/><text x="410" y="92" class="m">for i in range(1, n + 1):</text><g class="n" style="animation-delay:1.32s"><rect x="30" y="260" width="100" height="50" rx="25.0" fill="#6366f1"/><text x="80.0" y="291.0" text-anchor="middle" class="t">START</text></g><g class="n" style="animation-delay:1.44s"><rect x="170" y="250" width="180" height="70" rx="14" fill="#111a33" stroke="#6366f1" stroke-width="2.5"/><text x="260.0" y="271.0" text-anchor="middle" class="t">Ask count n</text><text x="260.0" y="291.0" text-anchor="middle" class="s">validate n &gt; 0</text><text x="260.0" y="311.0" text-anchor="middle" class="s">init counters</text></g><g class="n" style="animation-delay:1.56s"><rect x="410" y="250" width="190" height="70" rx="14" fill="#111a33" stroke="#6366f1" stroke-width="2.5"/><text x="505.0" y="281.0" text-anchor="middle" class="t">Read medicine data</text><text x="505.0" y="301.0" text-anchor="middle" class="s">name · stock · price · qty</text></g><g class="n" style="animation-delay:1.68s"><polygon points="630,285 730,220 830,285 730,350" fill="#111a33" stroke="#f59e0b" stroke-width="2.5"/><text x="730" y="291" text-anchor="middle" class="t">qty &gt; stock ?</text></g><g class="n" style="animation-delay:1.80s"><rect x="640" y="110" width="180" height="60" rx="14" fill="#111a33" stroke="#ef4444" stroke-width="2.5"/><text x="730.0" y="136.0" text-anchor="middle" class="t">Reject sale</text><text x="730.0" y="156.0" text-anchor="middle" class="s">revenue unchanged</text></g><g class="n" style="animation-delay:1.92s"><rect x="610" y="410" width="240" height="90" rx="14" fill="#111a33" stroke="#22c55e" stroke-width="2.5"/><text x="730.0" y="441.0" text-anchor="middle" class="t">Successful sale</text><text x="730.0" y="461.0" text-anchor="middle" class="s">sales = qty × price</text><text x="730.0" y="481.0" text-anchor="middle" class="s">stock −= qty · revenue += sales</text></g><g class="n" style="animation-delay:2.04s"><polygon points="910,285 1010,220 1110,285 1010,350" fill="#111a33" stroke="#f59e0b" stroke-width="2.5"/><text x="1010" y="281" text-anchor="middle" class="t">left &lt; 10 ?</text><text x="1010" y="301" text-anchor="middle" class="s">remaining stock</text></g><g class="n" style="animation-delay:2.16s"><rect x="915" y="110" width="190" height="60" rx="14" fill="#111a33" stroke="#f59e0b" stroke-width="2.5"/><text x="1010.0" y="136.0" text-anchor="middle" class="t">restock_count += 1</text><text x="1010.0" y="156.0" text-anchor="middle" class="s">low-stock warning</text></g><g class="n" style="animation-delay:2.28s"><rect x="1140" y="250" width="170" height="70" rx="14" fill="#111a33" stroke="#6366f1" stroke-width="2.5"/><text x="1225.0" y="281.0" text-anchor="middle" class="t">Store result</text><text x="1225.0" y="301.0" text-anchor="middle" class="s">processed_count += 1</text></g><g class="n" style="animation-delay:2.40s"><rect x="1380" y="250" width="190" height="70" rx="14" fill="#111a33" stroke="#6366f1" stroke-width="2.5"/><text x="1475.0" y="271.0" text-anchor="middle" class="t">Final report</text><text x="1475.0" y="291.0" text-anchor="middle" class="s">total revenue</text><text x="1475.0" y="311.0" text-anchor="middle" class="s">restock count</text></g><path d="M130 285 H170" class="e" marker-end="url(#ar)"/><path d="M350 285 H410" class="e" marker-end="url(#ar)"/><path d="M600 285 H630" class="e" marker-end="url(#ar)"/><path d="M730 220 V170" class="e" marker-end="url(#ar)"/><path d="M730 350 V410" class="e" marker-end="url(#ar)"/><path d="M820 140 H870 V285 H910" class="e" marker-end="url(#ar)"/><path d="M850 455 H870 V285" class="e"/><path d="M1010 220 V170" class="e" marker-end="url(#ar)"/><path d="M1110 285 H1140" class="e" marker-end="url(#ar)"/><path d="M1105 140 H1225 V250" class="e" marker-end="url(#ar)"/><path d="M1225 320 V535 H505 V320" class="e" marker-end="url(#ar)"/><path d="M1310 285 H1380" class="e" marker-end="url(#ar)"/><text x="742" y="200" class="l" fill="#ef4444">YES</text><text x="742" y="388" class="l" fill="#22c55e">NO</text><text x="1022" y="200" class="l" fill="#f59e0b">YES</text><text x="1114" y="274" class="l" fill="#22c55e">NO</text><text x="1335" y="272" class="l" fill="#6366f1">done</text><text x="860" y="562" text-anchor="middle" class="s">next medicine</text></svg>