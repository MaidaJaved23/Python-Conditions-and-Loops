<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1130" width="1600" height="1130" role="img" aria-labelledby="t d"><title id="t">Pharmacy processing loop flowchart</title><desc id="d">Flowchart of the for loop that validates medicine data, checks stock, completes or rejects a sale and counts restocks</desc><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ec4899"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
<linearGradient id="gv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ec4899"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#0d1a3c"/></linearGradient>
<radialGradient id="globe" cx=".38" cy=".35" r=".8"><stop offset="0" stop-color="#3b82f6"/><stop offset=".55" stop-color="#14307a"/><stop offset="1" stop-color="#070b16"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".35"/></filter>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f08a5d"/></marker><style>@keyframes dash{to{stroke-dashoffset:-24}}.flow{stroke-dasharray:12 12;animation:dash 1.2s linear infinite}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.fd{animation:fade .8s ease-out both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes pulse{50%{opacity:.35}}.pl{animation:pulse 2.6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}.sp{transform-box:fill-box;transform-origin:center;animation:spin 30s linear infinite}
@keyframes float{50%{transform:translateY(-9px)}}.fl{animation:float 5s ease-in-out infinite}
