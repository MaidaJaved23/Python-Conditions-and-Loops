<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" width="1400" height="520" role="img" aria-label="Sample run analytics">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1b1f4b"/></linearGradient>
<linearGradient id="g1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient>
<linearGradient id="g2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#15803d"/><stop offset="1" stop-color="#86efac"/></linearGradient>
<linearGradient id="g3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#b91c1c"/><stop offset="1" stop-color="#fca5a5"/></linearGradient>
<style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#e2e8f0}.k{font-size:20px;font-weight:600}.v{font-size:19px;font-weight:700}.b{transform-box:fill-box;transform-origin:bottom;animation:g 1.4s cubic-bezier(.2,.8,.2,1) both}@keyframes g{from{transform:scaleY(0)}}.th{stroke:#f87171;stroke-width:3;stroke-dasharray:10 8;animation:d 1.1s linear infinite}@keyframes d{to{stroke-dashoffset:-18}}</style></defs>
<rect width="1400" height="520" rx="24" fill="url(#bg)"/><text x="40" y="52" font-size="26" font-weight="700">Sample Run Analytics</text>
<rect x="40" y="80" width="640" height="400" rx="18" fill="#0f172a" stroke="#334155"/><rect x="720" y="80" width="640" height="400" rx="18" fill="#0f172a" stroke="#334155"/>
<text x="70" y="120" class="k">Sales amount per medicine (Rs.)</text>
<rect x="490" y="98" width="170" height="38" rx="19" fill="#4f46e5"/><text x="575" y="123" text-anchor="middle" class="v">Total Rs. 450</text>
<line x1="70" y1="430" x2="650" y2="430" stroke="#475569"/>
<rect class="b" x="150" y="222" width="120" height="208" rx="10" fill="url(#g1)"/><rect class="b" x="370" y="170" width="120" height="260" rx="10" fill="url(#g1)" style="animation-delay:.2s"/>
<text x="210" y="212" text-anchor="middle" class="v">Rs. 200</text><text x="430" y="160" text-anchor="middle" class="v">Rs. 250</text>
<text x="210" y="458" text-anchor="middle" class="k">Panadol</text><text x="430" y="458" text-anchor="middle" class="k">Vitamin C</text>
<text x="750" y="120" class="k">Remaining stock vs restock threshold</text>
<line x1="750" y1="430" x2="1330" y2="430" stroke="#475569"/>
<rect class="b" x="830" y="210" width="120" height="220" rx="10" fill="url(#g2)"/><rect class="b" x="1050" y="360" width="120" height="70" rx="10" fill="url(#g3)" style="animation-delay:.2s"/>
<line class="th" x1="750" y1="330" x2="1330" y2="330"/><text x="1330" y="318" text-anchor="end" font-size="16" font-weight="700" style="fill:#f87171">restock below 10</text>
<text x="890" y="200" text-anchor="middle" class="v">22 units</text><text x="1110" y="350" text-anchor="middle" class="v">7 units</text>
<text x="890" y="458" text-anchor="middle" class="k">Panadol</text><text x="1110" y="458" text-anchor="middle" class="k">Vitamin C</text>
<text x="40" y="508" font-size="14" style="fill:#94a3b8">Illustrative data taken from the sample execution in this README.</text></svg>