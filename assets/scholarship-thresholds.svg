vetica Neue',Arial,sans-serif" font-size="19" font-weight="400" fill="#8fa3d6" text-anchor="start" >maximum Rs. 50,000</text><clipPath id="c2"><rect x="200" y="570" width="1300" height="40" rx="20"/></clipPath><g clip-path="url(#c2)"><rect x="200" y="570" width="650" height="40" fill="#2f5fd0"/><text x="525.0" y="596" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="600" fill="#fff" text-anchor="middle" >Eligible: Rs. 50,000 or less</text><rect x="850" y="570" width="650" height="40" fill="#3b1d3f"/><text x="1175.0" y="596" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="600" fill="#fff" text-anchor="middle" >Not eligible: above Rs. 50,000</text></g><line x1="850" y1="562" x2="850" y2="618" stroke="#fff" stroke-width="2.5" stroke-dasharray="5 4"/><text x="850" y="642" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#fbbf24" text-anchor="middle" >Rs. 50,000 max</text><text x="200" y="642" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="500" fill="#8fa3d6" text-anchor="start" >Rs. 0</text><text x="1500" y="642" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="500" fill="#8fa3d6" text-anchor="end" >Rs. 100,000</text><circle cx="785.0" cy="590" r="15" fill="#22d3a0" stroke="#fff" stroke-width="3" class="pl"/><text x="785.0" y="556" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#6ee7b7" text-anchor="middle" >Ayesha Rs. 45,000</text><circle cx="980.0" cy="590" r="15" fill="#f43f5e" stroke="#fff" stroke-width="3" class="pl"/><text x="980.0" y="674" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#fda4af" text-anchor="middle" >Ali Rs. 60,000</text></g><circle cx="1160" cy="55" r="9" fill="#22d3a0"/><text x="1180" y="62" font-