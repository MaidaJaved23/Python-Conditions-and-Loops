<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="1400" height="700" role="img" aria-label="Scholarship Eligibility – Decision Flow"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1b1f4b"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker></defs><style>.t{font:600 19px 'Segoe UI',Arial,sans-serif;fill:#e2e8f0}.s{font:400 14px 'Segoe UI',Arial,sans-serif;fill:#94a3b8}.h{font:700 26px 'Segoe UI',Arial,sans-serif;fill:#fff}.l{font:700 15px 'Segoe UI',Arial,sans-serif}.e{fill:none;stroke:#7dd3fc;stroke-width:3;stroke-dasharray:10 8;animation:f 1.1s linear infinite}@keyframes f{to{stroke-dashoffset:-18}}.n{opacity:0;animation:i .7s ease forwards}@keyframes i{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.m{font:500 15px ui-monospace,Consolas,monospace;fill:#cbd5e1}</style><rect width="1400" height="700" rx="24" fill="url(#bg)"/><text x="40" y="52" class="h">Scholarship Eligibility – Decision Flow</text><g class="n" style="animation-delay:0.12s"><rect x="40" y="300" width="130" height="50" rx="25.0" fill="#6366f1"/><text x="105.0" y="331.0" text-anchor="middle" class="t">START</text></g><g class="n" style="animation-delay:0.24s"><rect x="200" y="285" width="190" height="80" rx="14" fill="#111a33" stroke="#6366f1" stroke-width="2.5"/><text x="295.0" y="311.0" text-anchor="middle" class="t">Input and validate</text><text x="295.0" y="331.0" text-anchor="middle" class="s">name · marks</text><text x="295.0" y="351.0" text-anchor="middle" class="s">attendance · income</text></g><g class="n" style="animation-delay:0.36s"><rect x="460" y="120" width="210" height="80" rx="14" fill="#111a33" stroke="#6366f1" stroke-width="2.5"/><text x="565.0" y="146.0" text-anchor="middle" class="t">Check marks</text><text x="565.0" y="166.0" text-anchor="middle" class="s">marks ≥ 80</text><text x="565.0" y="186.0" text-anchor="middle" class="s">fail → reasons.append()</text></g><g class="n" style="animation-delay:0.48s"><rect x="460" y="285" width="210" height="80" rx="14" fill="#111a33" stroke="#6366f1" stroke-width="2.5"/><text x="565.0" y="311.0" text-anchor="middle" class="t">Check attendance</text><text x="565.0" y="331.0" text-anchor="middle" class="s">attendance ≥ 85</text><text x="565.0" y="351.0" text-anchor="middle" class="s">fail → reasons.append()</text></g><g class="n" style="animation-delay:0.60s"><rect x="460" y="450" width="210" height="80" rx="14" fill="#111a33" stroke="#6366f1" stroke-width="2.5"/><text x="565.0" y="476.0" text-anchor="middle" class="t">Check income</text><text x="565.0" y="496.0" text-anchor="middle" class="s">income ≤ Rs. 50,000</text><text x="565.0" y="516.0" text-anchor="middle" class="s">fail → reasons.append()</text></g><g class="n" style="animation-delay:0.72s"><polygon points="750,325 860,255 970,325 860,395" fill="#111a33" stroke="#f59e0b" stroke-width="2.5"/><text x="860" y="321" text-anchor="middle" class="t">reasons empty?</text><text x="860" y="341" text-anchor="middle" class="s">len(reasons) == 0</text></g><g class="n" style="animation-delay:0.84s"><polygon points="1030,325 1120,255 1210,325 1120,395" fill="#111a33" stroke="#f59e0b" stroke-width="2.5"/><text x="1120" y="331" text-anchor="middle" class="t">marks ≥ 90 ?</text></g><g class="n" style="animation-delay:0.96s"><rect x="1005" y="100" width="230" height="70" rx="14" fill="#111a33" stroke="#22c55e" stroke-width="2.5"/><text x="1120.0" y="141.0" text-anchor="middle" class="t">FULL SCHOLARSHIP</text></g><g class="n" style="animation-delay:1.08s"><rect x="1005" y="480" width="230" height="70" rx="14" fill="#111a33" stroke="#f59e0b" stroke-width="2.5"/><text x="1120.0" y="521.0" text-anchor="middle" class="t">PARTIAL SCHOLARSHIP</text></g><g class="n" style="animation-delay:1.20s"><rect x="740" y="500" width="240" height="90" rx="14" fill="#111a33" stroke="#ef4444" stroke-width="2.5"/><text x="860.0" y="531.0" text-anchor="middle" class="t">NOT ELIGIBLE</text><text x="860.0" y="551.0" text-anchor="middle" class="s">print every reason</text><text x="860.0" y="571.0" text-anchor="middle" class="s">enumerate(reasons, 1)</text></g><path d="M170 325 H200" class="e" marker-end="url(#ar)"/><path d="M390 325 H425" class="e"/><path d="M425 160 V490" class="e"/><path d="M425 160 H460" class="e" marker-end="url(#ar)"/><path d="M425 325 H460" class="e" marker-end="url(#ar)"/><path d="M425 490 H460" class="e" marker-end="url(#ar)"/><path d="M670 160 H720" class="e"/><path d="M670 490 H720" class="e"/><path d="M720 160 V490" class="e"/><path d="M670 325 H750" class="e" marker-end="url(#ar)"/><path d="M970 325 H1030" class="e" marker-end="url(#ar)"/><path d="M1120 255 V170" class="e" marker-end="url(#ar)"/><path d="M1120 395 V480" class="e" marker-end="url(#ar)"/><path d="M860 395 V500" class="e" marker-end="url(#ar)"/><text x="985" y="313" class="l" fill="#22c55e">YES</text><text x="1132" y="218" class="l" fill="#22c55e">YES</text><text x="1132" y="445" class="l" fill="#ef4444">NO</text><text x="872" y="455" class="l" fill="#ef4444">NO</text></svg>