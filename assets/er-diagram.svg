oboto,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700" fill="#1b1410" text-anchor="start" >EVALUATION</text><text x="600" y="243.0" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="400" fill="#6b5a4a" text-anchor="start" >eligibility_status,</text><text x="600" y="268.0" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="400" fill="#6b5a4a" text-anchor="start" >scholarship_result</text></g><g class="fd" style="animation-delay:0.30s"><rect x="1090" y="150" width="460" height="170" rx="20" fill="#f6ecd9" filter="url(#sh)"/><text x="1120" y="216.0" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700" fill="#1b1410" text-anchor="start" >INELIGIBILITY_REASON</text><text x="1120" y="243.0" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="400" fill="#6b5a4a" text-anchor="start" >reason_no, reason_text</text><text x="1120" y="268.0" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="400" fill="#6b5a4a" text-anchor="start" >zero or more per student</text></g><path d="M510 235H570" class="flow" fill="none" stroke="#7dd3fc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M1030 235H1090" class="flow" fill="none" stroke="#7dd3fc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="540" y="225" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="800" fill="#fbbf24" text-anchor="middle" >1:1</text><text x="1060" y="225" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="800" fill="#fbbf24" text-anchor="middle" >1:N</text><text x="50" y="434" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#f08a5d" text-anchor="start" >TASK 2  ·  PHARMACY INVENTORY &amp; 