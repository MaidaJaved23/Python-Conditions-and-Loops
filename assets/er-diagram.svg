"start" >sale_status, quantity_sold,</text><text x="1120" y="568.0" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="400" fill="#c9b9a3" text-anchor="start" >sales_amount, remaining_stock</text></g><path d="M510 535H570" class="flow" fill="none" stroke="#7dd3fc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M1030 535H1090" class="flow" fill="none" stroke="#7dd3fc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="540" y="525" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="800" fill="#fbbf24" text-anchor="middle" >1:N</text><text x="1060" y="525" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="800" fill="#fbbf24" text-anchor="middle" >1:1</text><rect x="50" y="690" width="1500" height="70" rx="18" fill="#101833" stroke="#24305e" stroke-width="2"/><text x="800" y="733" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="500" fill="#c7d2fe" text-anchor="middle" >Conceptual model only: both programs keep their data in memory during the run.</text></svg>