" >str</text><line x1="1154" y1="260" x2="1526" y2="260" stroke="#24305e"/><rect x="1156" y="271" width="44" height="26" rx="8" fill="#2b1d55" /><text x="1178" y="290" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="800" fill="#c4b5fd" text-anchor="middle" >PK</text><text x="1214" y="292" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="600" fill="#fff" text-anchor="start" >reason_no</text><text x="1524" y="292" font-family="'SFMono-Regular',Consolas,Menlo,'Liberation Mono',monospace" font-size="18" font-weight="400" fill="#8fa3d6" text-anchor="end" >int</text><line x1="1154" y1="308" x2="1526" y2="308" stroke="#24305e"/><text x="1214" y="340" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="600" fill="#fff" text-anchor="start" >reason_text</text><text x="1524" y="340" font-family="'SFMono-Regular',Consolas,Menlo,'Liberation Mono',monospace" font-size="18" font-weight="400" fill="#8fa3d6" text-anchor="end" >str</text></g><path d="M460 250H600" class="flow" fill="none" stroke="#7dd3fc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="474" y="238" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="800" fill="#fbbf24" text-anchor="middle" >1</text><text x="586" y="238" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="800" fill="#fbbf24" text-anchor="middle" >1</text><text x="530.0" y="278" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="500" fill="#9fb3d9" text-anchor="middle" >receives</text><path d="M1000 250H1140" class="flow" fill="none" stroke="#7dd3fc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="1014" y="238" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="800" fill="#fbbf24" text-anchor="middle" >1</text><text x="1126" y="238" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="800" fill="#fbbf24" text-anchor="middle" >0..N</text><text x="1070.0" y="278" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="500" fill="#9fb3d9" text-anchor="middle" >lists</text><rect x="60" y="480" width="1480" height="200" rx="20" fill="#101833" stroke="#24305e" stroke-width="2"/><text x="90" y="525" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#fff" text-anchor="start" >Rules behind the attributes</text><circle cx="104" cy="558" r="5" fill="#ec4899"/><text x="124" y="564" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#c7d2fe" text-anchor="start" >marks &gt;= 80, attendance &gt;= 85, monthly_income &lt;= 50,000 must all hold</text><circle cx="104" cy="588" r="5" fill="#ec4899"/><text x="124" y="594" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#c7d2fe" text-anchor="start" >scholarship_result is Full (marks &gt;= 90), Partial (80 to below 90) or Not Eligible</text><circle cx="104" cy="618" r="5" fill="#ec4899"/><text x="124" y="624" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#c7d2fe" text-anchor="start" >each failed rule adds one INELIGIBILITY_REASON row, so every reason is shown</text><circle cx="104" cy="648" r="5" fill="#ec4899"/><text x="124" y="654" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#c7d2fe" text-anchor="start" >conceptual model only: data lives in memory, there is no database</text></svg>