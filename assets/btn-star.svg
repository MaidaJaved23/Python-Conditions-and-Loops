<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".35"/></filter>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f08a5d"/></marker><linearGradient id="bt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#ec4899"/></linearGradient><clipPath id="cp"><rect width="520" height="120" rx="60"/></clipPath><style>@keyframes dash{to{stroke-dashoffset:-24}}.flow{stroke-dasharray:12 12;animation:dash 1.2s linear infinite}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.fd{animation:fade .8s ease-out both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both}
