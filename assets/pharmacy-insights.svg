ht="800" fill="#fff" text-anchor="middle" >2</text><text x="850" y="306.5" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#1b1410" text-anchor="start" >Vitamin C sale</text><text x="850" y="335.5" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="400" fill="#6b5a4a" text-anchor="start" >5 x Rs. 50 = Rs. 250.00</text></g><g class="fd" style="animation-delay:0.30s"><rect x="750" y="376" width="760" height="94" rx="20" fill="#f6ecd9" filter="url(#sh)"/><circle cx="804" cy="423.0" r="26" fill="#c8553d"/><text x="804" y="432.0" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" fill="#fff" text-anchor="middle" >3</text><text x="850" y="414.5" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#1b1410" text-anchor="start" >Total revenue</text><text x="850" y="443.5" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="400" fill="#6b5a4a" text-anchor="start" >total_revenue += sales_amount: 200 + 250 = Rs. 450.00</text></g><g class="fd" style="animation-delay:0.45s"><rect x="750" y="484" width="760" height="94" rx="20" fill="#f6ecd9" filter="url(#sh)"/><circle cx="804" cy="531.0" r="26" fill="#c8553d"/><text x="804" y="540.0" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" fill="#fff" text-anchor="middle" >4</text><text x="850" y="522.5" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#1b1410" text-anchor="start" >Panadol stock left</text><text x="850" y="551.5" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="400" fill="#6b5a4a" text-anchor="start" >30 - 8 = 22 units, not below 10</text></g><g class="fd" style="animation-delay:0.60s"><rect x="750" y="592" width="760" height="94" rx="20" fill="#f6ecd9" filter="url(#sh)"/><circle cx="804" cy="639.0" r="26" fill="#c8553d"/><text x="804" y="648.0" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" fill="#fff" text-anchor="middle" >5</text><text x="850" y="630.5" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#1b1410" text-anchor="start" >Vitamin C stock left</text><text x="850" y="659.5" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="400" fill="#6b5a4a" text-anchor="start" >12 - 5 = 7 units, below 10, so restock_count += 1</text></g></svg>