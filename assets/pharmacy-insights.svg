1600" y2="240" stroke="#1e2d5a" stroke-opacity=".35"/><line x1="0" y1="320" x2="1600" y2="320" stroke="#1e2d5a" stroke-opacity=".35"/><line x1="0" y1="400" x2="1600" y2="400" stroke="#1e2d5a" stroke-opacity=".35"/><line x1="0" y1="480" x2="1600" y2="480" stroke="#1e2d5a" stroke-opacity=".35"/><line x1="0" y1="560" x2="1600" y2="560" stroke="#1e2d5a" stroke-opacity=".35"/><line x1="0" y1="640" x2="1600" y2="640" stroke="#1e2d5a" stroke-opacity=".35"/><line x1="0" y1="720" x2="1600" y2="720" stroke="#1e2d5a" stroke-opacity=".35"/><rect x="60" y="50" width="620" height="680" rx="24" fill="#0f1530" stroke="#24305e" stroke-width="2"/><text x="90" y="100" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="700" fill="#fff" text-anchor="start" >Revenue share</text><text x="90" y="132" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="400" fill="#8fa3d6" text-anchor="start" >Share of the Rs. 450 total</text><g transform="rotate(-90 370 400)" fill="none" stroke-width="62"><circle cx="370" cy="400" r="130" stroke="#1b2550"/><circle cx="370" cy="400" r="130" stroke="#8b5cf6" stroke-dasharray="363.0 453.8"/><circle cx="370" cy="400" r="130" stroke="#ec4899" stroke-dasharray="453.8 363.0" stroke-dashoffset="-363.0"/></g><text x="370" y="402" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="800" fill="#fff" text-anchor="middle" >Rs. 450</text><text x="370" y="436" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="500" fill="#8fa3d6" text-anchor="middle" >total revenue</text><rect x="110" y="602" width="24" height="24" rx="6" fill="#8b5cf6" /><text x="150" y="620" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#fff" text-anchor="start" >Panadol</text><text x="560" y="620" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="22" 